<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h1>STUDENT UPDATE FORM</h1>
    <form action="" method="post">
        {% csrf_token %}

        <label for="">Name</label>
        <input type="text" name="username" value="{{stud_data.name}}"> <br> <br>

        <label for="">Roll_no</label>
        <input type="text" name="userrollno" value="{{stud_data.roll_no}}"> <br> <br>

        <label for="">Department</label>
        <input type="text" name="userdepart" value="{{stud_data.department}}"> <br> <br>


        <label for="">Email</label>
        <input type="text" name="useremail" value="{{stud_data.email}}"> <br> <br> <br>

        <label for="">Marks</label>
        <input type="text" name="usermark" value="{{stud_data.mark}}"> <br> <br> <br>

        <button type="submit">UPDATE STUDENT</button>

    </form>
</body>
</html>
